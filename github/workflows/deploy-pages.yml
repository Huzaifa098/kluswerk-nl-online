name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main   # pas aan als jouw hoofdbranch anders heet
  workflow_dispatch: {}  # hierdoor kun je in Actions handmatig een run starten

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy CNAME and add .nojekyll if present
        run: |
          # Kopieer CNAME naar dist als het bestaat (voor custom domain)
          if [ -f CNAME ]; then cp CNAME dist/CNAME; fi
          # Voeg .nojekyll toe zodat Jekyll niets wegfiltert
          touch dist/.nojekyll

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
